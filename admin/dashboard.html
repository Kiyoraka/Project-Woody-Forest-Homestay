<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Owner dashboard - Woody Forest Homestay</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#122a1d">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

  <div class="app" id="app">

    <!-- ============================================================ SIDEBAR -->
    <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
      <a class="sidebar__brand" href="#main">
        <img src="../assets/img/logo.svg" alt="" width="40" height="40">
        <span>Woody <em>Forest</em><small>Owner dashboard</small></span>
      </a>

      <nav class="sidebar__nav">
        <a href="#main" class="sidebar__link is-active" data-view="main">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
          <span>Main</span>
        </a>
        <a href="#analysis" class="sidebar__link" data-view="analysis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5m0 14h16"/><path d="m7 14 4-5 3 3 5-6"/></svg>
          <span>Analysis</span>
        </a>
        <a href="#booking" class="sidebar__link" data-view="booking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg>
          <span>Booking</span>
          <b class="sidebar__badge hidden" id="pendingBadge">0</b>
        </a>
        <a href="#customer" class="sidebar__link" data-view="customer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M14.5 20a4.5 4.5 0 0 1 7 0"/></svg>
          <span>Customer</span>
        </a>
        <a href="#setting" class="sidebar__link" data-view="setting">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Setting</span>
        </a>
      </nav>

      <div class="sidebar__foot">
        <a class="sidebar__link sidebar__link--quiet" href="../index.html" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
          <span>View website</span>
        </a>
        <button class="sidebar__link sidebar__link--quiet" id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg>
          <span>Log out</span>
        </button>
      </div>
    </aside>
    <div class="sidebar__scrim" id="sidebarScrim" aria-hidden="true"></div>

    <!-- ============================================================ MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="topbar__menu btn btn--icon" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar__titles">
          <h1 class="topbar__title" id="viewTitle">Main</h1>
          <span class="topbar__date" id="topbarDate"></span>
        </div>
        <div class="topbar__right">
          <a class="btn btn--outline btn--sm topbar__cta" href="#booking">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
            <span id="topbarPending">0 pending</span>
          </a>
          <div class="user-chip" id="userChip">
            <span class="user-chip__avatar" id="userAvatar">O</span>
            <span class="user-chip__name" id="userName">Owner</span>
          </div>
        </div>
      </header>

      <main class="content" id="content">
        <section class="view" id="view-main" data-view="main"></section>
        <section class="view hidden" id="view-analysis" data-view="analysis"></section>
        <section class="view hidden" id="view-booking" data-view="booking"></section>
        <section class="view hidden" id="view-customer" data-view="customer"></section>
        <section class="view hidden" id="view-setting" data-view="setting"></section>
      </main>
    </div>

    <!-- ============================================================ MOBILE BOTTOM NAV -->
    <nav class="admin-bottom-nav" id="adminBottomNav" aria-label="Dashboard sections">
      <a href="#main" class="admin-bottom-nav__item is-active" data-view="main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg><span>Main</span>
      </a>
      <a href="#analysis" class="admin-bottom-nav__item" data-view="analysis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5m0 14h16"/><path d="m7 14 4-5 3 3 5-6"/></svg><span>Analysis</span>
      </a>
      <a href="#booking" class="admin-bottom-nav__item" data-view="booking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg><span>Booking</span>
      </a>
      <a href="#customer" class="admin-bottom-nav__item" data-view="customer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M14.5 20a4.5 4.5 0 0 1 7 0"/></svg><span>Customer</span>
      </a>
      <a href="#setting" class="admin-bottom-nav__item" data-view="setting">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3m10-10h-3M5 12H2m15.07-7.07-2.12 2.12M9.05 14.95l-2.12 2.12m0-10.14 2.12 2.12m5.9 5.9 2.12 2.12"/></svg><span>Setting</span>
      </a>
      <span class="admin-bottom-nav__pill" id="adminNavPill" aria-hidden="true"></span>
    </nav>
  </div>

  <!-- ============================================================ BOOKING MODAL -->
  <div class="modal-backdrop" id="bookingModal">
    <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="bookingModalTitle">
      <div class="modal__head">
        <div>
          <h3 class="h3" id="bookingModalTitle">Booking</h3>
          <span class="small muted" id="bookingModalSub"></span>
        </div>
        <button class="btn btn--icon btn--ghost" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal__body" id="bookingModalBody"></div>
      <div class="modal__foot" id="bookingModalFoot"></div>
    </div>
  </div>

  <!-- ============================================================ RECEIPT ZOOM -->
  <div class="receipt-zoom" id="receiptZoom" aria-hidden="true">
    <button class="btn btn--icon btn--light receipt-zoom__close" id="receiptZoomClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img id="receiptZoomImg" src="" alt="Receipt">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/admin/core.js"></script>
  <script src="../js/admin/view-main.js"></script>
  <script src="../js/admin/view-booking.js"></script>
  <script src="../js/admin/view-customer.js"></script>
  <script src="../js/admin/view-setting.js"></script>
</body>
</html>
