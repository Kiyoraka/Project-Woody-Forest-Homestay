<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Owner sign in - Woody Forest Homestay</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#122a1d">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preload" as="image" href="../assets/img/hero-exterior.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    /* ---------------------------------------------------------- page shell */
    body.login {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--forest-950);
      overflow-x: hidden;
    }

    /* Blurred photo + forest gradient. The blur lives on a fixed pseudo-element
       so the card stays sharp; scale(1.05) hides the soft blur edges. */
    .login-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .login-backdrop::before,
    .login-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .login-backdrop::before {
      background: url("../assets/img/hero-exterior.jpg") center / cover no-repeat;
      filter: blur(6px) saturate(1.05);
      transform: scale(1.05);
    }

    .login-backdrop::after {
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(47, 122, 82, 0.3), transparent 60%),
        linear-gradient(180deg, rgba(11, 26, 18, 0.55) 0%, rgba(18, 42, 29, 0.74) 55%, rgba(11, 26, 18, 0.92) 100%);
    }

    .login-main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-5);
      padding: max(var(--space-6), env(safe-area-inset-top)) var(--space-4) max(var(--space-6), env(safe-area-inset-bottom));
    }

    /* ---------------------------------------------------------------- card */
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: clamp(1.75rem, 6vw, 2.5rem);
      border-radius: var(--radius-lg);
      background: rgba(251, 248, 241, 0.9);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      color: var(--ink);
    }

    .login-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      text-align: center;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      margin-bottom: var(--space-2);
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(18, 42, 29, 0.28);
    }

    .login-head .eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: currentColor;
      opacity: 0.6;
    }

    .login-head .h2 {
      overflow-wrap: anywhere;
    }

    .login-sub {
      max-width: 30ch;
      font-size: var(--text-sm);
    }

    /* ---------------------------------------------------------------- form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }

    /* Grid keeps the toggle pinned to the input row even when UI.setInvalid
       appends an .error-text into this wrapper. */
    .password-wrap {
      display: grid;
      row-gap: var(--space-2);
    }

    .password-wrap > .input {
      grid-area: 1 / 1;
      padding-right: 3.25rem;
    }

    .password-wrap > .error-text {
      grid-row: 2;
    }

    .password-wrap input::-ms-reveal,
    .password-wrap input::-ms-clear {
      display: none;
    }

    .password-toggle {
      grid-area: 1 / 1;
      justify-self: end;
      align-self: center;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin-right: 6px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      transition: color var(--dur-fast), background-color var(--dur-fast);
    }

    .password-toggle:hover {
      color: var(--forest-700);
      background: rgba(31, 77, 53, 0.08);
    }

    .password-toggle:focus-visible {
      outline-offset: 0;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    .password-toggle .icon-eye-off,
    .password-toggle[aria-pressed="true"] .icon-eye {
      display: none;
    }

    .password-toggle[aria-pressed="true"] .icon-eye-off {
      display: block;
    }

    .login-submit {
      margin-top: var(--space-2);
    }

    .login-submit.is-loading {
      opacity: 0.85;
    }

    .login-submit.is-loading::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: var(--white);
      animation: login-spin 700ms linear infinite;
    }

    @keyframes login-spin {
      to { transform: rotate(360deg); }
    }

    .login-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-5);
      padding: 0.6rem 0.9rem;
      border-radius: var(--radius-sm);
      border: 1px dashed rgba(31, 77, 53, 0.22);
      background: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    .login-hint svg {
      width: 14px;
      height: 14px;
      flex: none;
      color: var(--forest-500);
    }

    .login-hint strong {
      color: var(--forest-700);
    }

    .login-noscript {
      margin-top: var(--space-3);
      text-align: center;
    }

    /* ----------------------------------------------------------- back link */
    .login-back {
      color: var(--cream);
      opacity: 0.9;
    }

    .login-back:hover {
      background: rgba(255, 255, 255, 0.12);
      opacity: 1;
    }

    .login-back:focus-visible {
      outline-color: var(--cream);
    }

    .login-back.view-enter {
      animation-delay: 140ms;
    }
  </style>
</head>
<body class="login">

  <div class="login-backdrop" aria-hidden="true"></div>

  <main class="login-main">
    <section class="login-card glass view-enter" id="loginCard" aria-labelledby="homestayName">
      <header class="login-head">
        <img class="login-logo" src="../assets/img/logo.svg" alt="" width="56" height="56">
        <p class="eyebrow">Owner dashboard</p>
        <h1 class="h2" id="homestayName">Woody Forest Homestay</h1>
        <p class="muted login-sub">Sign in to manage bookings, rates and photos.</p>
      </header>

      <form class="login-form" id="loginForm" novalidate>
        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M6.61 6.61A18.5 18.5 0 0 0 2 12s3.6 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn--primary btn--lg btn--block login-submit" id="signInButton" type="submit">Sign in</button>
        <button class="btn btn--outline btn--block" id="demoButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          Sign in with demo account
        </button>
      </form>

      <p class="hint login-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/>
          <path d="M12 8h.01"/>
        </svg>
        <span>Demo login: <strong>owner</strong> / <strong>woody123</strong></span>
      </p>

      <noscript>
        <p class="error-text login-noscript">JavaScript is required to sign in.</p>
      </noscript>
    </section>

    <a class="btn btn--ghost btn--sm login-back view-enter" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
      Back to website
    </a>
  </main>

  <script src="../js/ui.js"></script>
  <script src="../js/store.js"></script>
  <script>
    (() => {
      "use strict";

      const DASHBOARD_URL = "dashboard.html";
      const FALLBACK_NAME = "Woody Forest Homestay";
      const LOGIN_ERROR = "Incorrect username or password";

      const card = UI.qs("#loginCard");
      const form = UI.qs("#loginForm");
      const nameEl = UI.qs("#homestayName");
      const userInput = UI.qs("#username");
      const passInput = UI.qs("#password");
      const toggle = UI.qs("#togglePassword");
      const submit = UI.qs("#signInButton");

      let busy = false;
      let shakeTimer = 0;

      // Store.init() seeds the data and the demo admin; every sign-in waits on it.
      const booted = Store.init().then(
        () => true,
        (err) => {
          console.error(err);
          return false;
        }
      );

      function markInvalid(input, message) {
        UI.setInvalid(input, message);
        input.setAttribute("aria-invalid", "true");
      }

      function clearField(input) {
        if (!input.classList.contains("is-invalid")) return;
        UI.clearInvalid(input);
        input.removeAttribute("aria-invalid");
      }

      function setBusy(state) {
        busy = state;
        submit.disabled = state;
        submit.classList.toggle("is-loading", state);
        submit.textContent = state ? "Signing in…" : "Sign in";
        form.setAttribute("aria-busy", String(state));
      }

      function shakeCard() {
        // Drop the entrance animation first, otherwise it would replay once .shake is removed.
        card.classList.remove("view-enter", "shake");
        void card.offsetWidth; // restart the animation on repeated failures
        card.classList.add("shake");
        clearTimeout(shakeTimer);
        shakeTimer = setTimeout(() => card.classList.remove("shake"), 500);
      }

      // ------------------------------------------------ show / hide password
      toggle.addEventListener("click", () => {
        const show = passInput.type === "password";
        passInput.type = show ? "text" : "password";
        toggle.setAttribute("aria-pressed", String(show));
        toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });

      // ------------------------------------------------ clear errors on input
      [userInput, passInput].forEach((input) => {
        input.addEventListener("input", () => clearField(input));
      });

      // ------------------------------------------------ one-click demo login
      UI.qs("#demoButton").addEventListener("click", () => {
        userInput.value = Store.DEMO_ADMIN.username;
        passInput.value = Store.DEMO_ADMIN.password;
        clearField(userInput);
        clearField(passInput);
        form.requestSubmit();
      });

      // ---------------------------------------------------------- submit
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (busy) return;

        const username = userInput.value.trim();
        const password = passInput.value.trim();

        let firstInvalid = null;
        if (!username) {
          markInvalid(userInput, "Please enter your username");
          firstInvalid = userInput;
        }
        if (!password) {
          markInvalid(passInput, "Please enter your password");
          firstInvalid = firstInvalid || passInput;
        }
        if (firstInvalid) {
          firstInvalid.focus();
          return;
        }

        setBusy(true);

        let ok = false;
        try {
          await booted;
          ok = await Store.login(username, password);
        } catch (err) {
          console.error(err);
          ok = false;
        }

        if (ok) {
          UI.toast("Welcome back", "success");
          // Brief pause so the toast registers before the page changes.
          setTimeout(() => {
            location.href = DASHBOARD_URL;
          }, UI.prefersReducedMotion() ? 0 : 450);
          return;
        }

        setBusy(false);
        shakeCard();
        markInvalid(passInput, LOGIN_ERROR);
        passInput.focus();
        passInput.select();
        UI.toast(LOGIN_ERROR, "error");
      });

      // ------------------------------------------------------------ boot
      UI.ready(async () => {
        const ready = await booted;
        if (!ready) {
          UI.toast("Could not prepare sign-in. Please refresh the page.", "error");
          return;
        }

        if (Store.isAuthed()) {
          location.replace(DASHBOARD_URL);
          return;
        }

        const settings = Store.getSettings() || {};
        const name = typeof settings.name === "string" ? settings.name.trim() : "";
        nameEl.textContent = name || FALLBACK_NAME;

        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
          userInput.focus({ preventScroll: true });
        }
      });

      // Coming back via the browser Back button restores this page from cache:
      // reset the busy button, or skip straight to the dashboard if still signed in.
      window.addEventListener("pageshow", (event) => {
        if (!event.persisted) return;
        if (Store.isAuthed()) {
          location.replace(DASHBOARD_URL);
          return;
        }
        setBusy(false);
      });
    })();
  </script>
</body>
</html>
